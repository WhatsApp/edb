name: Release

# The otp28-<version> prefix keeps companion tags outside the release trigger patterns.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the tarball name (e.g. 0.0.0-dryrun1). No release is created.'
        required: true
      main_ref:
        description: 'Ref to build the OTP 29 escript from'
        default: 'main'
        required: true
      otp28_ref:
        description: 'Ref to build the OTP 28 escript from'
        default: 'otp-28.0'
        required: true

run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('[dry-run] Release {0} (no publish)', inputs.version) }}

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.refs.outputs.version }}
      main_ref: ${{ steps.refs.outputs.main_ref }}
      otp28_ref: ${{ steps.refs.outputs.otp28_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve release refs
        id: refs
        env:
          MAIN_REF: ${{ inputs.main_ref || github.ref_name }}
          OTP28_REF: ${{ inputs.otp28_ref || format('otp28-{0}', github.ref_name) }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # A fetch materializes branches only as remote-tracking refs
          # (origin/<name>); tags, SHAs, and the checked-out branch resolve
          # directly. Downstream checkout still receives the plain name.
          ref_exists() {
            git rev-parse --verify --quiet "$1^{commit}" >/dev/null \
              || git rev-parse --verify --quiet "origin/$1^{commit}" >/dev/null
          }
          if ! ref_exists "$MAIN_REF"; then
            echo "::error::Main ref '$MAIN_REF' not found."
            exit 1
          fi
          if ! ref_exists "$OTP28_REF"; then
            echo "::error::OTP 28 ref '$OTP28_REF' not found: no such branch, tag, or commit."
            exit 1
          fi
          {
            printf 'version=%s\n' "$VERSION"
            printf 'main_ref=%s\n' "$MAIN_REF"
            printf 'otp28_ref=%s\n' "$OTP28_REF"
          } >>"$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION main_ref=$MAIN_REF otp28_ref=$OTP28_REF"
      - name: Summarize release mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MAIN_REF: ${{ steps.refs.outputs.main_ref }}
          OTP28_REF: ${{ steps.refs.outputs.otp28_ref }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.refs.outputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            {
              printf "## Publishing release \`%s\`\n\n" "$REF_NAME"
              printf "Main ref: \`%s\`\n" "$MAIN_REF"
              printf "OTP 28 ref: \`%s\`\n\n" "$OTP28_REF"
              printf "The \`publish\` job will create the GitHub Release with the tarball attached.\n"
            } >>"$GITHUB_STEP_SUMMARY"
          else
            {
              printf '## Dry run: no release will be created\n\n'
              printf "Version label: \`%s\`\n" "$VERSION"
              printf "Main ref: \`%s\`\n" "$MAIN_REF"
              printf "OTP 28 ref: \`%s\`\n\n" "$OTP28_REF"
              printf "The assembled tarball will be available as the \`edb-tarball\` artifact on this run.\n"
            } >>"$GITHUB_STEP_SUMMARY"
          fi

  build-otp28:
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ${{ needs.resolve.outputs.otp28_ref }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.otp28_ref }}
      - uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # v1.20.4
        with:
          otp-version: '28.0'
          rebar3-version: 3.25.0
      - name: Escriptize
        run: rebar3 escriptize
      - name: Upload OTP 28 escript
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edb-otp28
          path: _build/default/bin/edb

  build-otp29:
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ${{ needs.resolve.outputs.main_ref }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.main_ref }}
      - uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # v1.20.4
        with:
          otp-version: '29.1'
          rebar3-version: 3.25.0
      - name: Escriptize
        run: rebar3 escriptize
      - name: Upload OTP 29 escript
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edb-otp29
          path: _build/default/bin/edb

  assemble:
    needs: [resolve, build-otp28, build-otp29]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ${{ needs.resolve.outputs.main_ref }} (dispatcher + tests)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.main_ref }}
      - name: Download OTP 28 escript
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: edb-otp28
          path: dist/edb-${{ needs.resolve.outputs.version }}/otp-28/
      - name: Download OTP 29 escript
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: edb-otp29
          path: dist/edb-${{ needs.resolve.outputs.version }}/otp-29/
      - name: Assemble tarball
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          ROOT="dist/edb-$VERSION"
          cp scripts/edb "$ROOT/edb"
          # Artifact round-trips may lose the executable bit; set it explicitly.
          chmod +x "$ROOT/edb" "$ROOT/otp-28/edb" "$ROOT/otp-29/edb"
          tar -czf "edb-$VERSION.tar.gz" -C dist "edb-$VERSION"
          tar -tzf "edb-$VERSION.tar.gz"
      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edb-tarball
          path: edb-${{ needs.resolve.outputs.version }}.tar.gz

  smoke:
    needs: [resolve, assemble]
    strategy:
      matrix:
        include:
          - otp-version: '28.0'
            expect: otp-28
          - otp-version: '29.1'
            expect: otp-29
    runs-on: ubuntu-22.04
    steps:
      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: edb-tarball
      - uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # v1.20.4
        with:
          otp-version: ${{ matrix.otp-version }}
      - name: Smoke-test dispatcher on OTP ${{ matrix.otp-version }}
        env:
          EXPECT: ${{ matrix.expect }}
          OTP_VERSION: ${{ matrix.otp-version }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          tar -xzf "edb-$VERSION.tar.gz"
          cd "edb-$VERSION"
          SELECTED=$(EDB_DISPATCH_DRYRUN=1 ./edb)
          case "$SELECTED" in
            */"$EXPECT"/edb) echo "Selected $SELECTED, as expected" ;;
            *) echo "::error::OTP $OTP_VERSION selected $SELECTED, expected $EXPECT/edb"; exit 1 ;;
          esac
          # Boot check: the escript must load and run under this OTP (a
          # bytecode/OTP mismatch crashes the loader instead of printing usage).
          # `--help` is not a real flag; argparse answers with usage text.
          ./edb --help 2>&1 | grep -q "Usage:"

  publish:
    needs: [resolve, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: edb-tarball
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "$TAG^" 2>/dev/null); then
            RANGE="$PREVIOUS_TAG..$TAG"
          else
            echo "::error::No prior stable release tag found. Provide a baseline tag or use curated initial-release notes."
            exit 1
          fi
          git log --pretty=format:'%h %s (%an)' "$RANGE" >release-notes.md
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --title "$TAG" "${flags[@]}" --notes-file release-notes.md "edb-$TAG.tar.gz"
