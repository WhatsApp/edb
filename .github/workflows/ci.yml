name: CI
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            otp-version: '29.1'
            rebar3-version: 3.25.0
          - os: macos-26
            otp-version: '29.1'
            rebar3-version: 3.25.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{matrix.otp-version}}
          rebar3-version: ${{matrix.rebar3-version}}
      - name: Cache Hex packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/rebar3/hex/hexpm/packages
          key: ${{ runner.os }}-hex-${{ hashFiles(format('{0}{1}', github.workspace, '/rebar.lock')) }}
          restore-keys: |
            ${{ runner.os }}-hex-
      - name: Compile
        run: rebar3 compile
      - name: Escriptize
        run: rebar3 escriptize
      - name: Test
        run: rebar3 ct
      - name: Format
        run: rebar3 fmt --check
      - name: XRef
        run: rebar3 xref
      - name: Setup ELP
        # setup-elp has no tagged releases yet: pin a commit
        uses: erlef/setup-elp@7be8461ac17ddcf91ea0f8f01bee0452a3e05561
        with:
          elp-version: '2026-10-05'
      # Both ELP steps are non-blocking until the existing violations are fixed.
      - name: ELP Lint
        run: elp lint
        continue-on-error: true
      - name: eqWAlizer
        run: elp eqwalize-all --bail-on-error
        continue-on-error: true
      - name: Create tarball edb-${{ matrix.os }}-otp-${{ matrix.otp-version }}.tar.gz
        run: 'tar -zcvf edb-${{ matrix.os }}-otp-${{ matrix.otp-version }}.tar.gz -C _build/default/bin edb'
      - name: Upload EDB escript
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edb-${{ matrix.os }}-otp-${{ matrix.otp-version }}.tar.gz
          path: edb-${{ matrix.os }}-otp-${{ matrix.otp-version }}.tar.gz
      - name: Cache Dialyzer PLTs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/rebar3/rebar3_*.plt
          key: ${{ runner.os }}-dialyzer-${{ hashFiles(format('{0}{1}', github.workspace, '/rebar.config')) }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-
      # T198620072: Solve the existing Dialyzer issues, then enable this
      # - name: Dialyzer
      #   run: rebar3 dialyzer
